[project]
name = "geometron-bot"
version = "0.1.0"
description = "A Python bot for generating procedural images with mathematical algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.1.0",
    "python-telegram-bot>=22.0",
]

[project.scripts]
geometron-bot = "geometron_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[tool.uv]
required-version = ">=0.12.0"

[tool.pytest]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
